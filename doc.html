<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <header class="container-fluid">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <div class="collapse navbar-collapse" id="navbarNav">
                    <a class="navbar-brand" href="#">Blogsmth</a>
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="#">Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact us!</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <h1 class="text-center mt-2">
            Blog Dashboard
        </h1>
    </header>
    <main>
        <div class="container-fluid px-4">
            <div class="row">
                <div class="col-md-3">
                    <div class="m-2 p-3 border rounded">
                        <h2>
                            Filters And Research
                        </h2>
                        <form>
                            <div class="mb-1">
                                <label for="titleSearchInput" class="form-label mt-1">
                                    Title
                                </label>
                                <div class="input-group">
                                    <input type="text" id="titleSearchInput" class="form-control"
                                        placeholder="Insert title" />
                                    <button class="btn btn-primary">
                                        Search
                                    </button>
                                </div>
                            </div>
                            <div class="mb-1">
                                <label for="contentSearchInput" class="form-label mt-1">
                                    Content
                                </label>
                                <div class="input-group">
                                    <input type="text" id="contentSearchInput" class="form-control"
                                        placeholder="Insert content" />
                                    <button class="btn btn-primary">
                                        Search
                                    </button>
                                </div>
                            </div>
                            <div class="mb-1">
                                <label for="dateSearchInput" class="form-label mt-1">
                                    Date
                                </label>
                                <div class="input-group">
                                    <input type="date" id="dateSearchInput" class="form-control">
                                    <button class="btn btn-primary">
                                        Search
                                    </button>
                                </div>
                            </div>
                            <div class="mb-1">
                                <label for="dateToDateSearchInput" class="form-label mt-1">
                                    From date to date
                                </label>
                                <div class="input-group">
                                    <input type="date" id="dateFromDateSearchInput" class="form-control" />
                                    <input type="date" id="dateToDateSearchInput" class="form-control ">
                                    <button class="btn btn-primary">
                                        Search
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="m-2 p-3 border rounded">
                        <h2>
                            Post details
                        </h2>
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <button class="btn btn-primary me-md-2" id="btnClear">
                                Clear
                            </button>
                        </div>
                        <form>
                            <div class="mb-3">
                                <label class="form-label" for="inputTitle">
                                    Title:
                                </label>
                                <input type="text" class="form-control" id="inputTitle" placeholder="Insert title" />
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="inputContent">
                                    Content:
                                </label>
                                <textarea type="text" class="form-control" id="inputContent" rows="5"
                                    placeholder="Insert content">
                                </textarea>
                            </div>
                            <div class="mb-3">
                                <button class="btn btn-success" id="btnSave">
                                    Create new
                                </button>
                                <button class="btn btn-secondary" id="btnUpdate">
                                    Update
                                </button>
                                <button class="btn btn-danger" id="btnDelete">
                                    Delete
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="m-2 p-3 border rounded">
                        <h2>
                            Post list
                        </h2>
                        <div class="mb-2">
                            <button class="btn btn-success mb-2 w-100" id="btnRefresh">
                                Refresh Articles
                            </button>
                            <div class="list-group overflow-auto" id="postLists">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="container-fluid text-muted ms-4 fixed-bottom border-top text-center">
            Made with love by @brainrottingSup3rnova on GitHub
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script type="module" src="pages/index.js"></script>
</body>

</html>
